/* ---- Backup & restore (the real backup story) ---- */
function blobToDataURL(b){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=function(){rej(fr.error);}; fr.readAsDataURL(b); }); }
function dataURLtoBlob(du){
  var m=/^data:([^;,]+)?(;base64)?,(.*)$/.exec(du);
  if(!m) return null;
  var mime=m[1]||"image/jpeg", b64=m[2], data=m[3];
  var bin=b64?atob(data):decodeURIComponent(data);
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function exportBackup(){
  toast("Preparing backup — one file with everything…");
  PENDING_ASYNC++;
  var done=function(){ PENDING_ASYNC=Math.max(0,PENDING_ASYNC-1); };
  var referenced={};
  TYPE_ORDER.forEach(function(t){ Object.keys(state.data[t]).forEach(function(b){ var ph=state.data[t][b].photos||{}; Object.keys(ph).forEach(function(key){ (ph[key]||[]).forEach(function(pid){ referenced[pid]=true; }); }); }); });
  state.history.forEach(function(rec){ if(rec.photos) Object.keys(rec.photos).forEach(function(key){ (rec.photos[key]||[]).forEach(function(pid){ referenced[pid]=true; }); }); });
  idbAll().catch(function(){ return []; }).then(function(recs){
    var want=recs.filter(function(r){ return referenced[r.id]; });
    var chain=Promise.resolve([]), out=[];
    want.forEach(function(r){
      chain=chain.then(function(){ return blobToDataURL(r.blob).then(function(du){ out.push({id:r.id,dataUrl:du}); },function(){}); });
    });
    return chain.then(function(){ return out; });
  }).then(function(photos){
    var payload={ app:"flameon-audit-backup", schemaVersion:7, exportedAt:nowStamp(), state:state, photos:photos };
    var js=JSON.stringify(payload);
    var b=new Blob([js],{type:"application/json"});
    var u=URL.createObjectURL(b); var a=document.createElement("a");
    a.href=u; a.download="FlameOn-Backup-"+todayISO()+".json"; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },200);
    toast("Backup downloaded ("+Math.round(js.length/1024)+" KB, "+photos.length+" photo"+(photos.length===1?"":"s")+"). Keep it OFF this device.");
    done();
  },function(e){ done(); alert("Backup failed: "+(e&&e.message?e.message:"unknown error")); });
}
function restoreBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    var d;
    try{ d=JSON.parse(fr.result); }catch(e){ alert("That file isn't a readable backup (invalid JSON)."); return; }
    if(!d||d.app!=="flameon-audit-backup"||!d.state){ alert("That file isn't a Flame On audit backup."); return; }
    if(!confirm("Restore the backup from "+(d.exportedAt||"unknown date")+"?\n\nThis REPLACES every audit, draft, photo and setting currently on this device.")) return;
    var kept=false;
    try{ var curRaw=localStorage.getItem(STORE_KEY); if(curRaw){ localStorage.setItem("flameon_ops_audit_prerestore", curRaw); kept=true; } }catch(e){}
    if(!kept && !confirm("Couldn't keep a safety copy of the CURRENT data (storage full). If you continue, the current data is gone for good. Continue anyway?")) return;
    PENDING_ASYNC++;
    var done=function(){ PENDING_ASYNC=Math.max(0,PENDING_ASYNC-1); };
    state=fixup(mergeState(d.state));
    reinitSets();
    save();
    syncQsOnBoot(); /* a restored backup may carry an older question set than this file */
    var photos=Array.isArray(d.photos)?d.photos:[];
    var chain=Promise.resolve(); var wrote=0;
    photos.forEach(function(p){
      chain=chain.then(function(){
        var b=p&&p.id?dataURLtoBlob(p.dataUrl||""):null;
        if(!b) return;
        return idbPut({id:p.id,blob:b,bytes:b.size,ts:Date.now()}).then(function(){wrote++;},function(){});
      });
    });
    chain.then(function(){
      done(); authed=false;
      syncHeaderInputs(); syncTypeUI(); renderSidebar(); renderMain(); updateHeader(); renderBanners();
      toast("Backup restored — "+state.history.length+" audits, "+wrote+" photo"+(wrote===1?"":"s")+".");
    },function(){ done(); toast("Backup restored (some photos could not be written)."); syncHeaderInputs(); renderSidebar(); renderMain(); updateHeader(); });
  };
  fr.onerror=function(){ alert("Couldn't read that file."); };
  fr.readAsText(file);
}

/* ---- Drawer ---- */
function openDrawer(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("scrim").classList.add("show"); }
function closeDrawer(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("scrim").classList.remove("show"); }

/* ---- Discard draft ---- */
function discardDraft(){
  if(!state.currentBranch){ alert("Select a branch first."); return; }
  if(!confirm("Discard "+state.currentBranch+"'s "+typeMeta().label+" DRAFT — scores, notes, actions, flags and its photos? Completed (locked) audits, other branches and other audit types are kept.")) return;
  var c=cur(); var pids=[];
  Object.keys(c.photos||{}).forEach(function(key){ pids=pids.concat(c.photos[key]||[]); });
  state.data[state.auditType][state.currentBranch]=emptyAudit();
  save();
  pids.forEach(function(pid){ if(!photoReferenced(pid)) idbDel(pid).catch(function(){}); });
  syncHeaderInputs(); renderMain(); renderSidebar(); updateHeader(); updateStorageMeter();
}

/* ================= HQ submission (v8.1) =================
   A completed audit is locked and immutable, so it can be re-sent safely and the queue only
   ever needs to remember record IDs — the payload is rebuilt from state.history + IndexedDB at
   send time. That keeps the queue inside `state` (so it rides along with save(), cross-tab sync
   and the JSON backup) instead of duplicating megabytes of photos into a second store.
   Failure is never silent and never lossy: a failed send leaves the audit on the device, queued,
   with the ⛃ Backup file always available as the manual fallback. */
var SUB_BUSY=false;

function subCfg(){ if(!state.submit||typeof state.submit!=="object") state.submit=Object.assign({},SUBMIT_DEFAULTS); return state.submit; }
function subOn(){ return !!subCfg().url; }
function subPending(){ return (state.submitQueue||[]).length; }
function subQueued(recId){ return (state.submitQueue||[]).some(function(x){ return x.recId===recId; }); }
function subEnqueue(recId,err){
  if(!Array.isArray(state.submitQueue)) state.submitQueue=[];
  var found=null;
  state.submitQueue.forEach(function(x){ if(x.recId===recId) found=x; });
  if(found){ found.tries=(found.tries||0)+1; found.err=err||""; found.at=nowStamp(); }
  else state.submitQueue.push({ recId:recId, at:nowStamp(), tries:err?1:0, err:err||"" });
}
function subDequeue(recId){ state.submitQueue=(state.submitQueue||[]).filter(function(x){ return x.recId!==recId; }); }

function updateSyncChip(){
  var b=document.getElementById("syncBtn"); if(!b) return;
  var n=subPending();
  b.classList.remove("pending","err");
  if(SUB_BUSY){ b.textContent="⇪ Sending…"; b.disabled=true; b.title="Uploading to head office…"; return; }
  b.disabled=false;
  if(!subOn()){ b.textContent="⇪ Sync"; b.title="No head-office endpoint set on this device yet — Admin → Head-office submission."; return; }
  if(n>0){
    b.textContent="⇪ Sync ("+n+")";
    b.classList.add(navigator.onLine?"pending":"err");
    b.title=n+" completed audit"+(n===1?"":"s")+" waiting to reach head office"+(navigator.onLine?" — tap to send now":" — you are offline; they go automatically when you reconnect");
    return;
  }
  b.textContent="⇪ Synced"; b.title="Every completed audit on this device has reached head office.";
}

/* Photos ride along as data URLs, oldest first, until the budget is spent. One photo may cross
   the line (the budget is checked before each attachment) — that is deliberate, so a single big
   photo is still sent rather than silently dropped. */
function subPhotos(rec){
  var ids=[];
  Object.keys(rec.photos||{}).forEach(function(key){ (rec.photos[key]||[]).forEach(function(pid){ ids.push({key:key,pid:pid}); }); });
  if(!ids.length) return Promise.resolve([]);
  var out=[], used=0, skipped=0;
  return ids.reduce(function(p,x){
    return p.then(function(){
      if(used>=SUBMIT_PHOTO_BUDGET){ skipped++; return; }
      return idbGet(x.pid).then(function(r){
        if(!r||!r.blob){ skipped++; return; }
        return blobToDataURL(r.blob).then(function(du){ used+=du.length; out.push({ key:x.key, id:x.pid, dataUrl:du }); });
      }).catch(function(){ skipped++; });
    });
  }, Promise.resolve()).then(function(){ out.skipped=skipped; return out; });
}

function subPayload(rec,photos){
  var openCapa=recordCapaList(rec).filter(function(x){ return x.cp.status!=="Verified Closed"; }).length;
  return {
    v:1, token:subCfg().token||"", doc:"FO-STD-001", app:APP_BUILD,
    submittedAt:nowStamp(), tz:"Asia/Karachi",
    device:String(navigator.userAgent||"").slice(0,180),
    /* Flat summary so the Sheet row needs no digging; `record` keeps the full locked snapshot. */
    summary:{
      id:rec.id, branch:rec.branch||"", type:rec.type||"", typeLabel:(TYPES[rec.type]&&TYPES[rec.type].label)||rec.type||"",
      date:rec.date||"", shift:rec.shift||"", by:rec.by||"", designation:rec.designation||"", item:rec.item||"",
      profile:rec.profile||"restaurant", score:(rec.score==null?"":rec.score), grade:rec.grade||"", tier:rec.tier||"",
      fail:!!rec.fail, findings:(rec.findings==null?"":rec.findings), completion:(rec.completion==null?"":rec.completion),
      safety:(rec.safety==null?"":rec.safety), stops:(rec.stops==null?"":rec.stops),
      failReasons:(rec.failReasons||[]).join(" | "), capaOpen:openCapa,
      photos:(photos||[]).length, qsVersion:rec.qsVersion||"", appBuild:rec.appBuild||"",
      completedAt:rec.tsCompleted||"", amended:!!rec.amendment, supersededBy:rec.supersededBy||""
    },
    record:rec, photos:photos||[]
  };
}

function subPost(url,payload){
  return new Promise(function(res,rej){
    if(!window.fetch){ rej(new Error("this browser cannot upload (no fetch support) — use ⛃ Backup and send the file instead")); return; }
    var ctl=window.AbortController?new AbortController():null, done=false;
    var timer=setTimeout(function(){ if(done) return; if(ctl) ctl.abort(); else { done=true; rej(new Error("upload timed out")); } }, SUBMIT_TIMEOUT_MS);
    /* text/plain keeps this a CORS "simple request". Apps Script web apps do not answer the
       preflight OPTIONS that an application/json body would trigger, so a JSON content-type
       fails in the browser before it ever leaves the device. */
    fetch(url,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), redirect:"follow", signal:ctl?ctl.signal:undefined })
      .then(function(r){ return r.text().then(function(t){ return {ok:r.ok,status:r.status,text:t}; }); })
      .then(function(r){
        clearTimeout(timer); if(done) return; done=true;
        if(!r.ok){ rej(new Error("head office replied "+r.status+(r.text?" — "+r.text.slice(0,140):""))); return; }
        var j=null; try{ j=JSON.parse(r.text); }catch(e){}
        if(!j){ rej(new Error("unexpected reply — check the Apps Script is deployed with access set to Anyone")); return; }
        if(!j.ok){ rej(new Error(j.error||"head office rejected the audit")); return; }
        res(j);
      })
      .catch(function(e){
        clearTimeout(timer); if(done) return; done=true;
        rej(new Error(e&&e.name==="AbortError"?"upload timed out — connection too slow":((e&&e.message)||"network error")));
      });
  });
}

function subOne(rec){
  var c=subCfg();
  if(!c.url) return Promise.reject(new Error("no head-office endpoint is set on this device"));
  var getPhotos=c.photos?subPhotos(rec):Promise.resolve([]);
  return getPhotos.then(function(photos){
    return subPost(c.url, subPayload(rec,photos)).then(function(j){
      rec.sub={ st:"sent", at:nowStamp(), ref:j.ref||"", photos:photos.length, tries:((rec.sub&&rec.sub.tries)||0)+1 };
      subDequeue(rec.id); save();
      return j;
    });
  }, function(e){ throw e; }).catch(function(e){
    rec.sub={ st:"error", at:nowStamp(), err:(e&&e.message)||"failed", tries:((rec.sub&&rec.sub.tries)||0)+1 };
    subEnqueue(rec.id, rec.sub.err); save();
    throw e;
  });
}

function subFlush(manual){
  if(SUB_BUSY){ if(manual) toast("A sync is already running…"); return Promise.resolve(); }
  if(!subOn()){
    if(manual) alert("No head-office endpoint is set on this device yet.\n\nAdmin → Head-office submission → paste the link head office gave you, then Save. Until then, finish audits normally and send the ⛃ Backup file.");
    updateSyncChip(); return Promise.resolve();
  }
  var q=(state.submitQueue||[]).slice();
  if(!q.length){ if(manual) toast("Nothing waiting — every completed audit is already with head office."); updateSyncChip(); return Promise.resolve(); }
  if(!navigator.onLine){
    if(manual) toast(q.length+" audit"+(q.length===1?"":"s")+" waiting — you are offline. They send themselves when you reconnect.");
    updateSyncChip(); return Promise.resolve();
  }
  SUB_BUSY=true; updateSyncChip();
  var sent=0, stopErr="";
  return q.reduce(function(p,item){
    return p.then(function(){
      if(stopErr) return;                       /* first failure stops the run — the rest fail identically */
      var rec=recById(item.recId);
      if(!rec){ subDequeue(item.recId); return; }
      return subOne(rec).then(function(){ sent++; }, function(e){ stopErr=(e&&e.message)||"failed"; });
    });
  }, Promise.resolve()).then(function(){
    SUB_BUSY=false; save(); updateSyncChip();
    var left=subPending();
    if(state.active===HISTORY&&VIEW_REC) renderMain();
    if(!stopErr){
      clearBanner("subfail");
      if(sent) toast(sent+" audit"+(sent===1?"":"s")+" sent to head office ✓");
    } else if(manual){
      alert("Couldn't send to head office:\n\n"+stopErr+"\n\n"+(sent?sent+" audit(s) did go through. ":"")+left+" still waiting.\n\nNothing is lost — the audits stay on this device and retry automatically. If the connection here is hopeless, use ⛃ Backup and send that file instead.");
    } else {
      setBanner("subfail","warn",left+" completed audit"+(left===1?"":"s")+" could not reach head office — "+esc(stopErr),
        "Nothing is lost: they are saved on this device and retry automatically (or tap ⇪ Sync). A ⛃ Backup file works as a manual fallback.");
    }
  });
}

/* Fire-and-forget send right after an audit is locked. */
function subAfterComplete(rec){
  if(!subOn()) return;
  subEnqueue(rec.id,"");
  save(); updateSyncChip();
  if(!subCfg().auto) return;
  if(!navigator.onLine){ toast("Saved — it will reach head office automatically when you are back online."); return; }
  subFlush(false);
}

function subChipHTML(rec){
  if(!subOn()) return '<span class="subchip off">⇪ head-office sending is off</span>';
  var s=rec.sub;
  if(s&&s.st==="sent") return '<span class="subchip sent">✓ sent to head office · '+esc(s.at||"")+'</span>';
  if(s&&s.st==="error") return '<span class="subchip err">⚠ not sent — '+esc(s.err||"failed")+'</span>';
  if(subQueued(rec.id)) return '<span class="subchip queued">⏳ waiting to send</span>';
  return '<span class="subchip queued">⏳ not sent yet</span>';
}

function subTest(){
  var c=subCfg(), out=document.getElementById("subTestOut");
  if(!c.url){ if(out) out.textContent="Paste the head-office link first, then Save."; return; }
  if(out) out.textContent="Testing…";
  subPost(c.url,{ v:1, token:c.token||"", ping:true, app:APP_BUILD, submittedAt:nowStamp(), device:String(navigator.userAgent||"").slice(0,180) })
    .then(function(j){ if(out) out.textContent="✓ Connected. Head office answered: "+(j.msg||"ok")+(j.sheet?" ("+j.sheet+")":""); },
          function(e){ if(out) out.textContent="✗ "+((e&&e.message)||"failed")+"\nCheck: the link ends in /exec, the Apps Script deployment access is \"Anyone\", and the token matches."; });
}

/* ---- Service worker / installability ---- */
function initServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol==="file:") return;   /* a downloaded single-file copy has no SW scope */
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound", function(){
      var nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange", function(){
        /* An existing controller means this is an UPDATE, not the first install. Never reload on
           the auditor's behalf — they may be mid-audit — just offer it. */
        if(nw.state==="installed"&&navigator.serviceWorker.controller){
          setBanner("swupdate","info","A newer version of the audit app is ready. <button class=\"btn sm\" data-swreload=\"1\">Reload now</button>",
            "Your drafts, completed audits and photos are untouched by an update. Finish what you are doing first if you prefer.");
        }
      });
    });
  }).catch(function(){});
}

/* ---- Wire ---- */
document.getElementById("syncBtn").addEventListener("click", function(){ subFlush(true); });
document.getElementById("banners").addEventListener("click", function(e){
  var b=e.target&&e.target.closest?e.target.closest("[data-swreload]"):null;
  if(b) location.reload();
});
window.addEventListener("online", function(){ updateSyncChip(); if(subPending()) subFlush(false); });
window.addEventListener("offline", updateSyncChip);
document.getElementById("completeBtn").addEventListener("click", completeAudit);
document.getElementById("csvBtn").addEventListener("click", exportCSV);
document.getElementById("printBtn").addEventListener("click", function(){ printAudit(state.active===HISTORY&&VIEW_REC?recById(VIEW_REC):null); });
window.addEventListener("beforeprint", function(){ if(!PRINT_READY) renderPrintVM(vmFrom(state.active===HISTORY&&VIEW_REC?recById(VIEW_REC):null),{}); });
document.getElementById("backupBtn").addEventListener("click", exportBackup);
document.getElementById("clearBtn").addEventListener("click", discardDraft);
document.getElementById("menuBtn").addEventListener("click", openDrawer);
document.getElementById("scrim").addEventListener("click", closeDrawer);
document.getElementById("progChip").addEventListener("click", function(){
  var nu=nextUnanswered();
  if(!nu){ toast(state.currentBranch?"All lines are answered — ready to complete.":"Select a branch first."); return; }
  state.active=nu.secId; save(); renderMain(); renderSidebar();
  var card=document.getElementById("card-"+nu.key);
  if(card){ card.scrollIntoView({block:"center"}); card.style.outline="3px solid var(--flame)"; setTimeout(function(){card.style.outline="";},1600); }
});
document.getElementById("photoModalClose").addEventListener("click", function(){ document.getElementById("photoModal").classList.remove("show"); if(MODAL_URL){ URL.revokeObjectURL(MODAL_URL); MODAL_URL=null; } });
document.getElementById("photoModal").addEventListener("click", function(e){ if(e.target===this){ this.classList.remove("show"); if(MODAL_URL){ URL.revokeObjectURL(MODAL_URL); MODAL_URL=null; } } });

/* Cross-tab sync: another tab saving is adopted here immediately instead of being
   silently overwritten by this tab's next save (v6 lost data this way). */
window.addEventListener("storage", function(ev){
  if(ev.key!==STORE_KEY||ev.newValue==null) return;
  try{ state=fixup(mergeState(JSON.parse(ev.newValue))); }catch(e){ return; }
  reinitSets();
  syncHeaderInputs(); syncTypeUI(); renderSidebar(); renderMain(); updateHeader(); updateSyncChip();
  toast("Updated with changes from another tab.");
});
window.addEventListener("beforeunload", function(e){
  if(SAVE_FAILED||PENDING_ASYNC>0){ e.preventDefault(); e.returnValue=""; return ""; }
});

(function init(){
  try{ localStorage.setItem("__fo_probe","1"); localStorage.removeItem("__fo_probe"); }
  catch(e){ setBanner("private","err","⚠ This browser is blocking storage (private/incognito mode, or site data blocked). NOTHING you enter will be kept after this tab closes.","Open the file in a normal browser window to audit for real."); }
  if(BOOT_CORRUPT) setBanner("corrupt","err","⚠ The saved audit data could not be read (it was corrupted). It has NOT been deleted — a recovery copy was quarantined in browser storage.","The app started fresh. If you have a JSON backup, restore it from Admin → Data. Otherwise contact support with the quarantined copy (localStorage key starting with flameon_ops_audit_corrupt_).");
  if(BOOT_MIGRATED) setBanner("migrated","info","Your existing audits were migrated from the previous version ("+BOOT_MIGRATED+") — nothing was lost.","The old data was left in place untouched, and an extra backup copy was stored under "+(BOOT_MIGRATED==="v7"?BACKUP_V7_KEY:(BOOT_MIGRATED==="v6"?BACKUP_V6_KEY:BACKUP_V5_KEY))+". Consider downloading a ⛃ Backup now.");
  syncQsOnBoot(); /* cross-device stale-questionnaire fix: reconcile cached sets with this file's embedded versions */
  idb().catch(function(){});
  bindHeader(); renderBanners(); renderSidebar(); renderMain(); updateHeader();
  initServiceWorker();
  updateSyncChip();
  /* Anything left queued from a previous session goes out as soon as the app opens online. */
  if(subOn()&&subPending()&&navigator.onLine) setTimeout(function(){ subFlush(false); },1200);
})();
</script>
