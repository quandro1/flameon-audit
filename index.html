<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flame On — Operations Audit · FO-STD-001</title>
<meta name="description" content="Flame On branch operations audit — daily checks, weekly/monthly/quarterly audits, CAPA register and branch dashboard. Works offline once installed.">
<!-- PWA. Relative href/scope so the app works from any GitHub Pages sub-path, and so a
     downloaded single-file copy (file://) simply 404s the manifest instead of breaking. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FO Audit">
<style>
  :root{
    --flame:#DA291C; --flame-dark:#A81B12; --charcoal:#1A1A1A; --ink:#262220;
    --cream:#FBF7EF; --cream-2:#F2ECDF; --paper:#fff; --line:#DCD6C8; --line-soft:#EAE4D6;
    --green:#2E7D32; --green-bg:#E7F1E7; --amber:#E08A00; --amber-bg:#FBF0DC; --red:#C62828; --red-bg:#FBE6E5;
    --muted:#6E6858; --muted-2:#8C8577;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,"Liberation Sans",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --shadow:0 1px 2px rgba(26,26,26,.04),0 4px 16px rgba(26,26,26,.05);
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;line-height:1.45}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--flame);outline-offset:2px}

  .masthead{background:var(--charcoal);color:var(--cream);border-bottom:4px solid var(--flame)}
  .masthead .inner{max-width:1220px;margin:0 auto;padding:15px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:inline-flex;align-items:center;gap:10px}
  .logo .flame-mark{width:28px;height:28px;flex:none}
  .logo .name{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:17px;line-height:1}
  .logo .name b{color:var(--flame)}
  .masthead h1{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-left:1px solid #4a443c;padding-left:14px;color:#efe9dd}
  .masthead .code{font-family:var(--mono);font-size:10.5px;color:#b8b0a2;letter-spacing:.04em;margin-left:auto;text-align:right;line-height:1.5}
  .masthead .code b{color:var(--flame);font-weight:700}

  #banners{max-width:1220px;margin:0 auto;padding:0 22px}
  .appbanner{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:11px 14px;margin:10px 0 0;font-size:13px;font-weight:600;border:1px solid}
  .appbanner.err{background:var(--red);border-color:var(--red);color:#fff}
  .appbanner.warn{background:var(--amber-bg);border-color:#ecd6a6;color:#7a5500}
  .appbanner.info{background:var(--cream-2);border-color:var(--line);color:var(--ink)}
  .appbanner .bx{margin-left:auto;background:none;border:none;color:inherit;font-size:15px;cursor:pointer;padding:0 2px;line-height:1}
  .appbanner .bmsg{flex:1}.appbanner .bmsg small{display:block;font-weight:500;opacity:.9;margin-top:2px}
  .appbanner button.btn{flex:none}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--charcoal);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:200;display:none;max-width:92vw;text-align:center}

  .headbar{background:var(--paper);border-bottom:1px solid var(--line)}
  .headbar .inner{max-width:1220px;margin:0 auto;padding:13px 22px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field.branchsel{position:relative}
  .field label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
  .field input,.field select{font-family:var(--sans);font-size:14px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--cream);color:var(--ink);width:100%;min-width:140px;min-height:44px}
  .field.branchsel select{border-color:var(--flame);font-weight:700;background:#fff}
  .field.typesel select{border-color:var(--charcoal);font-weight:700;background:#fff}
  .field input:focus,.field select:focus{outline:none;border-color:var(--flame);background:#fff;box-shadow:0 0 0 2px var(--red-bg)}
  .headbar .grow{flex:1 1 220px} /* real basis so flex wrapping accounts for the input's min-width */
  .resultblock{margin-left:auto;display:flex;align-items:center;gap:14px}
  .gradebadge{font-family:var(--mono);font-weight:800;font-size:23px;padding:8px 13px;border-radius:10px;line-height:1;min-width:58px;text-align:center}
  .gradebadge.g{background:var(--green-bg);color:var(--green)} .gradebadge.a{background:var(--amber-bg);color:#8a5600} .gradebadge.r{background:var(--red-bg);color:var(--red)} .gradebadge.n{background:var(--cream-2);color:var(--muted-2)} .gradebadge.fail{background:var(--red);color:#fff}
  .resultinfo{display:flex;flex-direction:column;gap:3px;min-width:150px}
  .resultinfo .rscore{font-family:var(--mono);font-size:13.5px;font-weight:700}
  .resultinfo .rtier{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted)}
  .resultinfo .progbar{width:150px;max-width:100%;height:6px;border-radius:5px;background:var(--cream-2);overflow:hidden;border:1px solid var(--line-soft);margin-top:2px}
  .resultinfo .progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--flame),var(--flame-dark));border-radius:5px;transition:width .25s}

  .toolbar{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .toolbar .inner{max-width:1220px;margin:0 auto;padding:9px 22px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .toolbar .crumb{font-size:12.5px;color:var(--muted);font-weight:600} .toolbar .crumb b{color:var(--ink)}
  .toolbar .prog{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--muted);background:var(--cream-2);border:1px solid var(--line-soft);border-radius:14px;padding:5px 10px;white-space:nowrap;cursor:pointer}
  .toolbar .prog.done{color:var(--green);background:var(--green-bg)}
  .toolbar .prog.qs{cursor:default;color:var(--ink)}
  .toolbar .prog.qs.warn{color:#7a5200;background:#FBF3D9;border-color:#E8D48B}
  .toolbar .prog.qs.stale{color:#fff;background:var(--red);border-color:var(--red)}
  button.btn{font-family:var(--sans);font-size:12.5px;font-weight:650;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:7px;line-height:1;display:inline-flex;align-items:center;gap:6px;min-height:38px}
  button.btn:hover{border-color:var(--flame);color:var(--flame-dark)}
  button.btn.ghost{background:transparent}
  button.btn.submit{border-color:var(--flame);color:#fff;background:var(--flame)} button.btn.submit:hover{background:var(--flame-dark);color:#fff}
  button.btn.sm{font-size:11.5px;padding:7px 10px;min-height:32px}
  button.btn[disabled]{opacity:.5;cursor:not-allowed}
  .toolbar .tb-right{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
  .menuBtn{display:none;font-size:16px;padding:8px 11px}

  .layout{max-width:1220px;margin:0 auto;display:flex;align-items:flex-start;gap:0;position:relative}
  .scrim{display:none}
  .sidebar{width:280px;flex:none;position:sticky;top:48px;align-self:flex-start;max-height:calc(100vh - 48px);overflow-y:auto;padding:14px 12px 60px;border-right:1px solid var(--line);background:var(--cream)}
  .side-group{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:13px 12px 6px}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:none;cursor:pointer;padding:11px 12px;font-family:var(--sans);font-size:13px;color:var(--ink);border-radius:9px;margin-bottom:1px;min-height:42px}
  .nav-item:hover{background:var(--cream-2)}
  .nav-item.active{background:var(--charcoal);color:#fff;font-weight:650}
  .nav-item .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line);box-shadow:0 0 0 2px var(--cream)}
  .nav-item.active .dot{box-shadow:0 0 0 2px #322d28}
  .dot.partial{background:var(--amber)} .dot.done{background:var(--green)} .dot.flag{background:var(--red)}
  .nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item .ct{font-family:var(--mono);font-size:10.5px;color:var(--muted-2)} .nav-item.active .ct{color:#cfc8ba}
  .nav-item.big{font-weight:700} .nav-item .ico{font-size:14px;width:16px;text-align:center}
  .nav-top{border-bottom:1px solid var(--line-soft);padding-bottom:8px;margin-bottom:2px}
  .nav-bottom{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:12px}
  .nav-bottom .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--red);color:#fff;padding:1px 7px;border-radius:9px}
  .nav-bottom .badge.zero{background:var(--green-bg);color:var(--green)}
  .storagebox{margin-top:14px;border-top:1px solid var(--line-soft);padding:12px 12px 0;font-size:10.5px;color:var(--muted)}
  .storagebox .sb-bar{height:6px;border-radius:4px;background:var(--cream-2);border:1px solid var(--line-soft);overflow:hidden;margin:6px 0 4px}
  .storagebox .sb-bar i{display:block;height:100%;background:var(--green);border-radius:4px}
  .storagebox .sb-bar i.warn{background:var(--amber)} .storagebox .sb-bar i.full{background:var(--red)}
  .storagebox b{font-family:var(--mono)}

  .main{flex:1;min-width:0;padding:22px 26px 90px}

  .ov-grade{display:flex;align-items:center;gap:20px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;flex-wrap:wrap}
  .ov-grade .big{font-family:var(--mono);font-weight:800;font-size:44px;line-height:1;padding:14px 20px;border-radius:14px;min-width:94px;text-align:center}
  .ov-grade .big.daily{font-size:30px}
  .ov-grade .big.g{background:var(--green-bg);color:var(--green)} .ov-grade .big.a{background:var(--amber-bg);color:#8a5600} .ov-grade .big.r{background:var(--red-bg);color:var(--red)} .ov-grade .big.n{background:var(--cream-2);color:var(--muted-2)} .ov-grade .big.fail{background:var(--red);color:#fff}
  .ov-grade .gtxt{flex:1;min-width:170px}
  .ov-grade .gtxt .score{font-family:var(--mono);font-size:25px;font-weight:700}
  .ov-grade .gtxt .tier{font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);margin-top:3px}
  .ov-grade .gtxt .meta{font-size:12px;color:var(--muted);margin-top:8px} .ov-grade .gtxt .meta b{color:var(--ink)}
  .ov-fail{display:none;border:2px solid var(--red);background:var(--red);color:#fff;border-radius:12px;padding:13px 18px;margin-bottom:16px;font-weight:700;font-size:14px;align-items:center;gap:11px}
  .ov-fail.show{display:flex} .ov-fail .tr{font-weight:500;font-size:12.5px;opacity:.92}
  .lockchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;background:var(--charcoal);color:#fff;border-radius:16px;padding:4px 12px}
  .lockchip.amend{background:var(--amber);color:#fff}
  .amendnote{font-size:12px;color:var(--muted);background:var(--cream-2);border:1px solid var(--line-soft);border-radius:9px;padding:9px 13px;margin-bottom:14px}

  .panel{border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .panel .ph{padding:12px 18px;border-bottom:1px solid var(--line-soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .panel .ph .sub{margin-left:auto;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
  .panel.crit .ph{background:var(--red-bg);color:#8c2019;border-bottom-color:#f0cfcd}
  .crit-body{padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px}
  .crit-row{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;min-height:44px}
  .crit-row:hover{background:var(--red-bg)} .crit-row input{width:20px;height:20px;accent-color:var(--red);cursor:pointer;flex:none}

  .stop-row{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line-soft);font-size:13px;font-weight:600}
  .stop-row:last-child{border-bottom:none}
  .stop-pill{font-family:var(--mono);font-weight:800;font-size:11px;padding:2px 9px;border-radius:9px;flex:none;min-width:44px;text-align:center}
  .stop-pill.ok{background:var(--green-bg);color:var(--green)} .stop-pill.bad{background:var(--red);color:#fff} .stop-pill.pending{background:var(--cream-2);color:var(--muted-2)}
  .stop-row .sr-sec{margin-left:auto;font-size:11px;color:var(--muted-2);font-weight:500;text-align:right}

  .cat-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
  .cat-row:last-child{border-bottom:none}
  .cat-row .cn{font-weight:650;font-size:13.5px;width:160px;flex:none}
  .cat-row .cw{font-family:var(--mono);font-size:11px;color:var(--muted-2);width:48px;flex:none}
  .cat-row .cbar{flex:1;height:9px;border-radius:6px;background:var(--cream-2);overflow:hidden;border:1px solid var(--line-soft);min-width:60px}
  .cat-row .cbar i{display:block;height:100%;border-radius:6px;background:var(--flame)}
  .cat-row .cp{font-family:var(--mono);font-weight:700;font-size:13.5px;width:46px;text-align:right;flex:none}
  .cat-row.muted .cn{color:var(--muted)} .cat-row.muted .cbar i{background:var(--muted-2)}
  .cat-note{font-size:11.5px;color:var(--muted);padding:10px 18px;border-top:1px solid var(--line-soft);background:var(--cream-2)}

  .so-grid{padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .so-grid .f label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:5px}
  .so-grid .f input{width:100%;font-family:var(--sans);font-size:13.5px;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:var(--cream);color:var(--ink);min-height:44px}
  .so-grid .f input:focus{outline:none;border-color:var(--flame);background:#fff}

  /* Dashboard */
  .dash-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .dash-head h2{margin:0;font-size:24px;font-weight:850;letter-spacing:-.01em}
  .dash-head .sub{font-size:12.5px;color:var(--muted)}
  .dash-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
  .dtab{font-family:var(--sans);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;min-height:38px}
  .dtab:hover{border-color:var(--flame);color:var(--flame-dark)}
  .dtab.active{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
  .dtab .dtn{font-family:var(--mono);font-size:10.5px;opacity:.75;margin-left:4px}
  .dash-filter{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin:0 0 14px}
  .dash-filter .field input{min-width:130px}
  .dash-filter .fnote{font-size:11.5px;color:var(--muted);padding-bottom:12px}
  .dash-insight{font-size:13px;color:var(--ink);background:var(--cream-2);border:1px solid var(--line-soft);border-radius:10px;padding:11px 15px;margin-bottom:16px}
  .dash-insight b{color:var(--flame-dark)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
  .stat{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:var(--shadow);padding:15px 16px 14px;overflow:hidden}
  .stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--flame)}
  .stat.alert:before{background:var(--red)} .stat.good:before{background:var(--green)}
  .stat .sl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .stat .sv{font-family:var(--mono);font-size:23px;font-weight:700;margin-top:6px;line-height:1.15}
  .stat .sx{font-size:11.5px;color:var(--muted);margin-top:3px}
  .stat.alert .sv{color:var(--red)}
  .tablewrap{overflow-x:auto}
  table.rank{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
  table.rank th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line)}
  table.rank td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  table.rank tr:last-child td{border-bottom:none}
  table.rank tbody tr:hover{background:var(--cream)}
  table.rank tr.failrow td{background:var(--red-bg)}
  .rankcirc{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:12px;background:var(--cream-2);color:var(--muted)}
  .rankcirc.m1{background:#F6D67A;color:#7a5a00} .rankcirc.m2{background:#E2E2E6;color:#5b5b62} .rankcirc.m3{background:#E7C39B;color:#7a4a1e}
  table.rank .bn{font-weight:700} table.rank .bn small{display:block;font-size:11px;color:var(--muted-2);font-weight:400}
  .scorecell{display:flex;align-items:center;gap:9px;min-width:120px}
  .scorecell .sval{font-family:var(--mono);font-weight:700;width:42px} .scorecell .sbar{flex:1;height:7px;border-radius:5px;background:var(--cream-2);overflow:hidden;min-width:50px}
  .scorecell .sbar i{display:block;height:100%;border-radius:5px}
  .gd{font-family:var(--mono);font-weight:800;padding:3px 9px;border-radius:6px;display:inline-block;font-size:12.5px}
  .gd.g{background:var(--green-bg);color:var(--green)} .gd.a{background:var(--amber-bg);color:#8a5600} .gd.r{background:var(--red-bg);color:var(--red)} .gd.fail{background:var(--red);color:#fff}
  .tchip{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
  .t-plat{background:#EAF1FB;color:#2563A8} .t-gold{background:#FBF0DC;color:#8a5600} .t-silv{background:#EFEFF1;color:#565660} .t-bronze{background:#F3E7DC;color:#7d4a24} .t-rec{background:#FBE6E5;color:#C62828}
  .flagpill{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--red-bg);color:var(--red)}
  .flagpill.hot{background:var(--red);color:#fff}
  .okpill{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted-2)}

  .trendsvg{width:100%;height:auto;display:block}
  .trend-legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px 4px;font-size:12px}
  .trend-legend .tl{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
  .trend-legend .tl i{width:11px;height:11px;border-radius:3px;display:inline-block}

  table.heat{width:100%;border-collapse:collapse;font-size:12px;min-width:620px}
  table.heat th{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
  table.heat th:first-child{text-align:left}
  table.heat td{padding:5px 6px;text-align:center}
  table.heat td:first-child{text-align:left;font-weight:650;font-size:12.5px;white-space:nowrap}
  table.heat .cell{font-family:var(--mono);font-weight:700;color:#fff;border-radius:6px;padding:8px 4px;display:block;font-size:11.5px}
  table.heat .cell.na{background:var(--cream-2)!important;color:var(--muted-2)}
  .dash-empty{padding:44px 24px;text-align:center;border:1px dashed var(--line);border-radius:14px;background:var(--paper)}

   only if the Intl timezone database is unavailable. */
function karachiParts(){
  try{
    var f=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Karachi",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    var p={}; f.formatToParts(new Date()).forEach(function(x){ p[x.type]=x.value; });
    if(p.year&&p.month&&p.day) return p;
  }catch(e){}
  var d=new Date();
  return { year:String(d.getFullYear()), month:String(d.getMonth()+1).padStart(2,"0"), day:String(d.getDate()).padStart(2,"0"),
           hour:String(d.getHours()).padStart(2,"0"), minute:String(d.getMinutes()).padStart(2,"0") };
}

function genId(){ return "x"+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36); }
function normalize(secs){
  return (secs||[]).map(function(s){
    return { id:s.id||genId(), name:s.name||"Untitled section", grp:(s.grp||"Operations"), cat:(s.cat===undefined?null:s.cat), inferred:!!s.inferred,
      checks:(s.checks||[]).map(function(ch,i){ return { id:ch.id||((s.id||"s")+"-"+i), q:ch.q||"", lk:ch.lk||"", rf:ch.rf||"", spec:!!ch.spec, crit:!!ch.crit }; }) };
  });
}

/* =====================================================================
   PURE SCORING ENGINE
   Every grade on every surface (live header, overview, completed record,
   dashboard, CSV, print) comes from these two pure functions. They read
   nothing from the app state, so they are directly unit-testable — see
   runSelfTest() below / the "Run scoring self-check" button in Admin.

   ROUNDING POLICY (stated, deliberate): the corporate score / daily
   compliance is computed unrounded, then rounded HALF-UP TO A WHOLE
   PERCENT exactly once, and the GRADE IS TAKEN FROM THE ROUNDED VALUE.
   So a raw 94.5 rounds to 95 and grades A+; a raw 94.49 rounds to 94 and
   grades A. Displayed number and grade therefore always agree.
   Category percentages are rounded for display only, never re-fed into math.

   AUTO-FAIL RULE (§6): the audit fails if ANY critical-gate incident is
   ticked OR ANY question flagged food-safety-critical is answered "No".
   (v6 only honoured the gate checkboxes — an undercooked-chicken "No"
   could still grade A+. Fixed and covered by the self-check.)
   ===================================================================== */
function gradeFromScore(score){
  var l,t;
  if(score>=95){l="A+";t="Platinum branch";}
  else if(score>=90){l="A";t="Gold branch";}
  else if(score>=85){l="B+";t="Silver branch";}
  else if(score>=80){l="B";t="Bronze branch";}
  else if(score>=75){l="C+";t="Recovery program";}
  else if(score>=70){l="C";t="Recovery program";}
  else{l="D";t="Recovery program";}
  return {letter:l, band:(score>=85?"g":(score>=75?"a":"r")), tier:t};
}
function grade(score){ return gradeFromScore(score); } /* legacy alias used by dashboard renderers */

function pureFullResult(sections, weights, scores, gateFlags, gateNames){
  var yes={}, no={}, cats={};
  (sections||[]).forEach(function(sec){
    if(!sec.cat) return;
    sec.checks.forEach(function(ch){
      var v=scores[sec.id+"||"+ch.id];
      if(v==="yes") yes[sec.cat]=(yes[sec.cat]||0)+1;
      else if(v==="no") no[sec.cat]=(no[sec.cat]||0)+1;
    });
  });
  Object.keys(weights).forEach(function(c){
    var y=yes[c]||0, n=no[c]||0;
    cats[c]=(y+n===0)?null:(y/(y+n)*100); /* N/A and unanswered excluded; all-N/A category = null */
  });
  var aw=0, ws=0;
  Object.keys(weights).forEach(function(c){ if(cats[c]!==null){ aw+=weights[c]; ws+=cats[c]*weights[c]; } });
  var raw=(aw===0)?null:(ws/aw); /* null categories drop out: weight redistributed, never counted as zero */
  var reasons=[];
  Object.keys(gateFlags||{}).forEach(function(i){ if(gateFlags[i]&&gateNames&&gateNames[i]) reasons.push(gateNames[i]); });
  (sections||[]).forEach(function(sec){
    sec.checks.forEach(function(ch){
      if(ch.crit && scores[sec.id+"||"+ch.id]==="no") reasons.push(sec.name+" — "+ch.q);
    });
  });
  var fail=reasons.length>0;
  var score=(raw===null)?null:Math.round(raw); /* the single rounding step */
  var g=(score===null)?null:gradeFromScore(score);
  return { raw:raw, score:score, cats:cats, fail:fail, failReasons:reasons,
           letter:g?g.letter:null, band:g?g.band:null, tier:g?g.tier:null, safety:cats.safety };
}
function pureDailyResult(sections, scores){
  var yes=0, no=0, secPct={}, stops=[];
  (sections||[]).forEach(function(sec){
    var sy=0, sn=0;
    sec.checks.forEach(function(ch){
      var v=scores[sec.id+"||"+ch.id];
      if(v==="yes"){yes++;sy++;} else if(v==="no"){no++;sn++;}
      if(ch.crit && v==="no") stops.push({secName:sec.name, secId:sec.id, q:ch.q});
    });
    secPct[sec.id]=(sy+sn===0)?null:(sy/(sy+sn)*100);
  });
  var raw=(yes+no===0)?null:(yes/(yes+no)*100);
  var comp=(raw===null)?null:Math.round(raw); /* the single rounding step */
  var badge,band,tier,fail=false;
  if(stops.length>0){ badge="STOP"; band="fail"; tier=stops.length+" stop item"+(stops.length===1?"":"s")+" failed"; fail=true; }
  else if(comp===null){ badge="—"; band="n"; tier="Not started"; }
  else if(comp>=DAILY_PASS){ badge="PASS"; band="g"; tier="On standard"; }
  else if(comp>=DAILY_WATCH){ badge="WATCH"; band="a"; tier="Below the "+DAILY_PASS+"% daily target"; }
  else { badge="FAIL"; band="r"; tier="Well below the daily target"; }
  return { raw:raw, comp:comp, badge:badge, band:band, tier:tier, fail:fail, stops:stops, secPct:secPct };
}

/* ---- Scoring self-check: hardcoded cases, runnable from Admin or console (FO_SELFTEST()) ---- */
function runSelfTest(){
  var out=[], W={product:35,safety:20,service:15,clean:10,delivery:10,inventory:5,staff:5};
  function mk(cat,n,crit){ var cs=[]; for(var i=0;i<n;i++) cs.push({id:"c"+i,q:"Q"+i,crit:!!(crit&&i===0),spec:false}); return {id:"s_"+cat,name:"Sec "+cat,grp:"T",cat:cat,checks:cs}; }
  var SECS7=Object.keys(W).map(function(c){ return mk(c,4,c==="safety"); }); /* 7 cats × 4 checks; safety c0 is crit */
  function fill(val,except){ var sc={}; SECS7.forEach(function(s){ s.checks.forEach(function(ch){ var key=s.id+"||"+ch.id; sc[key]=(except&&except[key])?except[key]:val; }); }); return sc; }
  function T(name,actual,expected){ var ok=JSON.stringify(actual)===JSON.stringify(expected); out.push({name:name,expected:expected,actual:actual,pass:ok}); }

  T("Category weights sum to 100", Object.keys(CATWEIGHTS).reduce(function(a,c){return a+CATWEIGHTS[c];},0), 100);

  var r=pureFullResult(SECS7,W,fill("yes"),{},CRITICAL);
  T("All-max audit scores 100", r.score, 100);
  T("All-max audit grades A+", r.letter, "A+");
  T("All-max audit does not fail", r.fail, false);

  [[95,"A+"],[94,"A"],[90,"A"],[89,"B+"],[85,"B+"],[84,"B"],[80,"B"],[79,"C+"],[75,"C+"],[74,"C"],[70,"C"],[69,"D"],[0,"D"]].forEach(function(p){
    T("Band edge: rounded "+p[0]+" grades "+p[1], gradeFromScore(p[0]).letter, p[1]);
  });

  /* Rounding: safety 3 yes / 1 no = 75, others all yes -> raw = (95*100+20*75)/... compute: all cats 100 except safety 75:
     raw=(35+15+10+10+5+5)*100+20*75 over 100 = (80*100+1500)/100=95 exactly. Use service instead for a fraction:
     service 4 checks: 3y1n = 75 -> raw=(85*100+15*75)/100=96.25 -> rounds 96 -> A+ */
  var r2=pureFullResult(SECS7,W,fill("yes",(function(){var e={};e["s_service||c3"]="no";return e;})()),{},CRITICAL);
  T("Raw 96.25 rounds once to 96", r2.score, 96);
  T("Raw 96.25 grades A+ from the rounded value", r2.letter, "A+");
  T("Round-half-up policy: Math.round(94.5) grades A+", gradeFromScore(Math.round(94.5)).letter, "A+");
  T("Round-half-up policy: Math.round(94.49) grades A", gradeFromScore(Math.round(94.49)).letter, "A");

  var r3=pureFullResult(SECS7,W,fill("yes"),{2:true},CRITICAL);
  T("Perfect score + critical-gate incident: fail", r3.fail, true);
  T("Perfect score + critical-gate incident: score stays 100", r3.score, 100);
  T("Perfect score + critical-gate incident: reason recorded", r3.failReasons[0], CRITICAL[2]);

  var r4=pureFullResult(SECS7,W,fill("yes",(function(){var e={};e["s_safety||c0"]="no";return e;})()),{},CRITICAL);
  T("Critical QUESTION answered No forces fail (v7 rule)", r4.fail, true);
  T("Critical-question fail carries the section+question as reason", r4.failReasons.length, 1);

  var naEx={}; SECS7[1].checks.forEach(function(ch){ naEx["s_safety||"+ch.id]="na"; });
  var r5=pureFullResult(SECS7,W,fill("yes",naEx),{},CRITICAL);
  T("Whole category N/A -> category excluded (null)", r5.cats.safety, null);
  T("Whole category N/A -> weight redistributed, score still 100", r5.score, 100);
  var mixEx={}; mixEx["s_product||c2"]="na"; mixEx["s_product||c3"]="na";
  var r6=pureFullResult(SECS7,W,fill("yes",mixEx),{},CRITICAL);
  T("Within-category N/A excluded: 2 yes + 2 N/A = 100%", r6.cats.product, 100);

  var DS=[ {id:"d1",name:"Brand",grp:"B",cat:null,checks:[{id:"a",q:"qa"},{id:"b",q:"qb"},{id:"c",q:"qc"},{id:"d",q:"qd"}]},
           {id:"d2",name:"Safety",grp:"S",cat:null,checks:[{id:"a",q:"sa",crit:true},{id:"b",q:"sb",crit:true}]} ];
  var dsc={}; DS.forEach(function(s){s.checks.forEach(function(ch){dsc[s.id+"||"+ch.id]="yes";});});
  T("Daily all-yes: PASS", pureDailyResult(DS,dsc).badge, "PASS");
  var dsc2=Object.assign({},dsc); dsc2["d2||a"]="no";
  var dr=pureDailyResult(DS,dsc2);
  T("Daily perfect + one stop-item No: STOP", dr.badge, "STOP");
  T("Daily STOP is a fail", dr.fail, true);
  var dsc3=Object.assign({},dsc); dsc3["d1||a"]="no"; /* 5/6 = 83.33 -> 83 WATCH */
  T("Daily 83.3% rounds to 83: WATCH", pureDailyResult(DS,dsc3).badge, "WATCH");
  var dsc4={}; DS[0].checks.forEach(function(ch){dsc4["d1||"+ch.id]=(ch.id==="a")?"yes":"no";}); DS[1].checks.forEach(function(ch){dsc4["d2||"+ch.id]="yes";});
  /* 3/6 = 50 -> FAIL */
  T("Daily 50%: FAIL", pureDailyResult(DS,dsc4).badge, "FAIL");

  /* ---- v8: warehouse question set + branch->profile mapping ---- */
  T("Warehouse category weights sum to 100", Object.keys(WCATWEIGHTS).reduce(function(a,c){return a+WCATWEIGHTS[c];},0), 100);
  T("Branch mapping: Warehouse -> warehouse profile", branchProfile("Warehouse"), "warehouse");
  T("Branch mapping: restaurant branch -> restaurant profile", branchProfile("Delco"), "restaurant");
  var WS=normalize(WH_DEFAULT_SECTIONS);
  var wsc={}; WS.forEach(function(s){ s.checks.forEach(function(ch){ wsc[s.id+"||"+ch.id]="yes"; }); });
  var wr=pureFullResult(WS,WCATWEIGHTS,wsc,{},CRITICAL);
  T("Warehouse all-yes audit scores 100", wr.score, 100);
  T("Warehouse all-yes audit does not fail", wr.fail, false);
  var wsc2=Object.assign({},wsc); var firstCrit=null;
  WS.forEach(function(s){ s.checks.forEach(function(ch){ if(ch.crit&&!firstCrit) firstCrit=s.id+"||"+ch.id; }); });
  wsc2[firstCrit]="no";
  T("Warehouse crit question answered No forces fail", pureFullResult(WS,WCATWEIGHTS,wsc2,{},CRITICAL).fail, true);
  var naProd={}; WS.forEach(function(s){ s.checks.forEach(function(ch){ naProd[s.id+"||"+ch.id]=(s.cat==="wh_prod")?"na":"yes"; }); });
  var wr3=pureFullResult(WS,WCATWEIGHTS,naProd,{},CRITICAL);
  T("Warehouse: whole Production section N/A -> excluded (null)", wr3.cats.wh_prod, null);
  T("Warehouse: Production N/A -> weight redistributed, score still 100", wr3.score, 100);

  var passN=out.filter(function(x){return x.pass;}).length;
  return { pass:passN, fail:out.length-passN, total:out.length, cases:out };
}
window.FO_SELFTEST=runSelfTest;

/* =====================================================================
   STATE & PERSISTENCE (schema v7)
   - Key flameon_ops_audit_v7; migrates read-only from v6 then v5, and
     stores the ORIGINAL raw blob under flameon_ops_audit_backup_v6 / _v5
     before the first v7 write. The old keys are never modified.
   - Corrupt JSON is quarantined under flameon_ops_audit_corrupt_<ts>,
     never overwritten, and the user is told.
   - Storage failures are NEVER silent: red banner + beforeunload guard.
   ===================================================================== */
var SAVE_FAILED=false, PENDING_ASYNC=0, BOOT_CORRUPT=false, BOOT_MIGRATED="";
var VIEW_REC=null; /* record id open in the History view (transient) */

function blank(){ return { schemaVersion:8, config:null, dconfig:null, wconfig:null, wdconfig:null, admin:null, settings:{capaDueDays:7}, branchProfiles:{},
  qsMeta:{ full:{base:QS_FILE.full,edits:0}, daily:{base:QS_FILE.daily,edits:0}, wh:{base:QS_FILE.wh,edits:0}, whdaily:{base:QS_FILE.whdaily,edits:0} },
  submit:Object.assign({}, SUBMIT_DEFAULTS, BAKED_SUBMIT||{}), submitQueue:[],
  auditType:"weekly", dashType:"weekly", currentBranch:"", data:{daily:{},weekly:{},monthly:{},quarterly:{}}, history:[], active:OVERVIEW }; }
/* Merge stored/imported state over blank(). CRITICAL SUBTLETY: blank() carries THIS FILE's
   qsMeta stamps; if the stored data predates qsMeta (v5/v6/v7), letting blank()'s stamps
   survive the merge would make an old cached question set look already-synced and defeat
   the stale-questionnaire fix. Legacy states map to {base:1, edits:qsVersion-1} — every
   pre-v8 question set derived from file generation 1. */
function mergeState(p){
  var d=Object.assign(blank(), p||{});

    d.qsMeta={ full:{base:1, edits:Math.max(0,((p&&p.qsVersion)||1)-1)},

}
function emptyAudit(){ return { scores:{},notes:{},capa:{},critical:{},photos:{}, date:todayISO(), by:"",designation:"",item:"",shift:"", sigAuditor:"",sigManager:"",sigOps:"",followup:"", status:"draft", amendmentOf:null, amendReason:"" }; }
function normAudit(a){
  if(!a||typeof a!=="object") a={};
  ["scores","notes","capa","critical","photos"].forEach(function(f){ if(!a[f]||typeof a[f]!=="object"||Array.isArray(a[f])) a[f]={}; });
  ["date","by","designation","item","shift","sigAuditor","sigManager","sigOps","followup","amendReason"].forEach(function(f){ if(typeof a[f]!=="string") a[f]=a[f]==null?"":String(a[f]); });
  Object.keys(a.capa).forEach(function(key){
    var cp=a.capa[key]; if(!cp||typeof cp!=="object"){ cp={}; a.capa[key]=cp; }
    ["cause","action","owner","deadline"].forEach(function(f){ if(typeof cp[f]!=="string") cp[f]=cp[f]==null?"":String(cp[f]); });
    if(CAPA_STATUSES.indexOf(cp.status)<0) cp.status="Open";
    if(!cp.severity) cp.severity="Standard";

function fixup(d){
  /* v7 -> v8 in-place: new per-set version metadata + warehouse configs + branch profiles.
     Legacy qsVersion/dqsVersion (v7 edit counters) map to {base:1, edits:counter-1}: any v7
     question set was by definition derived from file generation 1. */
  if(!d.qsMeta||typeof d.qsMeta!=="object"){
    d.qsMeta={
      full:{base:1, edits:Math.max(0,(d.qsVersion||1)-1)},
      daily:{base:1, edits:Math.max(0,(d.dqsVersion||1)-1)},
      wh:{base:0, edits:0}, whdaily:{base:0, edits:0}
    };
  }
  ["full","daily","wh","whdaily"].forEach(function(s){
    if(!d.qsMeta[s]||typeof d.qsMeta[s]!=="object") d.qsMeta[s]={base:0,edits:0};
    if(!(d.qsMeta[s].base>=0)) d.qsMeta[s].base=0;
    if(!(d.qsMeta[s].edits>=0)) d.qsMeta[s].edits=0;
  });
  if(d.wconfig===undefined) d.wconfig=null;
  if(d.wdconfig===undefined) d.wdconfig=null;
  if(!d.branchProfiles||typeof d.branchProfiles!=="object") d.branchProfiles=BAKED_PROFILES?Object.assign({},BAKED_PROFILES):{};
  d.schemaVersion=8;
  if(!d.data||typeof d.data!=="object") d.data={};
  TYPE_ORDER.forEach(function(t){
    if(!d.data[t]||typeof d.data[t]!=="object") d.data[t]={};
    Object.keys(d.data[t]).forEach(function(b){ d.data[t][b]=normAudit(d.data[t][b]); });
  });
  if(!Array.isArray(d.history)) d.history=[];
  d.history.forEach(function(h){
    if(!h.type) h.type="weekly";
    if(!h.id) h.id=genId();
    if(h.supersededBy===undefined) h.supersededBy=null;
    if(h.capa&&typeof h.capa==="object"){ Object.keys(h.capa).forEach(function(key){ var cp=h.capa[key]; if(cp&&CAPA_STATUSES.indexOf(cp.status)<0) cp.status="Open"; }); }
  });
  if(!d.settings||typeof d.settings!=="object") d.settings={};
  if(!(d.settings.capaDueDays>0)) d.settings.capaDueDays=7;
  /* v8.1 submission config. A device that has never been configured adopts the file's endpoint;
     one the auditor/admin has already pointed somewhere keeps its own URL across app updates. */
  if(!d.submit||typeof d.submit!=="object") d.submit={};
  if(typeof d.submit.url!=="string"||!d.submit.url) d.submit.url=(BAKED_SUBMIT&&BAKED_SUBMIT.url)||SUBMIT_DEFAULTS.url;
  if(typeof d.submit.token!=="string"||!d.submit.token) d.submit.token=(BAKED_SUBMIT&&BAKED_SUBMIT.token)||SUBMIT_DEFAULTS.token;
  if(typeof d.submit.photos!=="boolean") d.submit.photos=SUBMIT_DEFAULTS.photos;
  if(typeof d.submit.auto!=="boolean") d.submit.auto=SUBMIT_DEFAULTS.auto;
  if(!Array.isArray(d.submitQueue)) d.submitQueue=[];

  d.submitQueue=d.submitQueue.filter(function(q){ return q&&q.recId&&d.history.some(function(h){ return h.id===q.recId; }); });
  if(!(d.qsVersion>0)) d.qsVersion=1;
  if(!(d.dqsVersion>0)) d.dqsVersion=1;
  if(!TYPES[d.auditType]) d.auditType="weekly";
  if(!TYPES[d.dashType]) d.dashType=d.auditType;

}
function readKey(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function quarantine(raw){ try{ localStorage.setItem("flameon_ops_audit_corrupt_"+Date.now(), raw); }catch(e){} }
function load(){
  var raw=readKey(STORE_KEY);

    try{ return fixup(mergeState(JSON.parse(raw))); }
    catch(e){ quarantine(raw); BOOT_CORRUPT=true; }
  }
  var r7=readKey(KEY_V7);
  if(r7!==null){
    try{
      var d7=fixup(mergeState(JSON.parse(r7)));
      try{ if(readKey(BACKUP_V7_KEY)===null) localStorage.setItem(BACKUP_V7_KEY, r7); }catch(e2){}
      BOOT_MIGRATED="v7";
      return d7;
    }catch(e){ quarantine(r7); }
  }
  var r6=readKey(KEY_V6);
  if(r6!==null){
    try{
      var d6=fixup(mergeState(JSON.parse(r6)));
      try{ if(readKey(BACKUP_V6_KEY)===null) localStorage.setItem(BACKUP_V6_KEY, r6); }catch(e2){}
      BOOT_MIGRATED="v6";
      return d6;
    }catch(e){ quarantine(r6); }
  }
  var r5=readKey(KEY_V5);

    try{
      var v5=JSON.parse(r5);

function save(){
  var js;

  if(js===null){ setBanner("savefail","err","⚠ Internal error while saving — your latest change was NOT stored.","Use ⛃ Backup in the toolbar, then reload."); SAVE_FAILED=true; return; }
  try{
    localStorage.setItem(STORE_KEY, js);
    if(SAVE_FAILED){ SAVE_FAILED=false; clearBanner("savefail"); toast("Saving works again — everything is being stored."); }
    if(js.length*2 > 3.5*1024*1024) setBanner("quota","warn","Audit storage is getting full ("+Math.round(js.length*2/1024)+" KB of a ~5 MB browser limit).","Download a ⛃ Backup, then clear old dashboard history you no longer need.");

    SAVE_FAILED=true;

function persistConfig(which){

  if(QS_BUMPED[which]===false){ state.qsMeta[which].edits++; QS_BUMPED[which]=true; }

var QS_BUMPED={full:false,daily:false,wh:false,whdaily:false};
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var state = load();
var SECTIONS, DSECTIONS, WSECTIONS, WDSECTIONS;
function reinitSets(){
  SECTIONS  = normalize(state.config  && state.config.length  ? state.config  : (BAKED_CONFIG  || DEFAULT_SECTIONS));
  DSECTIONS = normalize(state.dconfig && state.dconfig.length ? state.dconfig : (BAKED_DAILY   || DAILY_DEFAULT_SECTIONS));

/* =====================================================================
   QUESTIONNAIRE VERSION SYNC (the cross-device stale-questionnaire fix)
   The stamps embedded in THIS file (QS_FILE, or __FO_BAKED_QSV__ in an
   admin-baked copy) are the single source of truth. A device whose
   localStorage still carries an OLDER cached question set is refreshed:
   - automatically, when the cached set has no admin edits and no draft
     holds answers (the replaced copy is archived first, never destroyed);
   - via an explicit banner + Admin "Sync" button when admin edits or
     in-progress drafts exist (never silently, never losing answers —
     draft answers stay keyed to their question ids and survive a sync
     for every question that still exists).
   A device whose cached set is NEWER than this file gets a red warning:
   the user has opened an outdated copy of the app file.
   Completed audits are untouched either way — each locked record renders
   from its own embedded snapshot forever.
   ===================================================================== */
function setConfigKey(set){ return set==="full"?"config":(set==="daily"?"dconfig":(set==="wh"?"wconfig":"wdconfig")); }
function fileStamp(set){
  var b=window.__FO_BAKED_QSV__;
  if(b&&b[set]&&b[set].base>0) return {base:b[set].base, edits:b[set].edits||0};
  return {base:QS_FILE[set], edits:0};
}
function qsLabel(set){ var m=(state.qsMeta&&state.qsMeta[set])||{base:1,edits:0}; return "v"+m.base+(m.edits>0?"."+m.edits:""); }
function qsNewer(a,b){ return a.base>b.base || (a.base===b.base && (a.edits||0)>(b.edits||0)); }
function activeSetKey(){ var wh=curProfile()==="warehouse"; return isDaily()?(wh?"whdaily":"daily"):(wh?"wh":"full"); }
function dirtyDraftsFor(set){
  var out=[], types=(set==="daily"||set==="whdaily")?["daily"]:["weekly","monthly","quarterly"];
  var wantWh=(set==="wh"||set==="whdaily");
  types.forEach(function(t){
    Object.keys(state.data[t]||{}).forEach(function(b){
      if((branchProfile(b)==="warehouse")!==wantWh) return;
      var a=state.data[t][b];
      if(a&&a.scores&&Object.keys(a.scores).length>0) out.push(TYPES[t].short+" — "+b);
    });
  });
  return out;
}
function archiveReplacedSet(set,secs){ try{ localStorage.setItem("flameon_qs_replaced_"+set+"_"+Date.now(), JSON.stringify(secs)); }catch(e){} }
function applyFileSet(set){
  var ck=setConfigKey(set), fsSt=fileStamp(set);
  if(state[ck]) archiveReplacedSet(set, state[ck]);
  state[ck]=null;
  state.qsMeta[set]={base:fsSt.base, edits:fsSt.edits};
  reinitSets(); save();
}
function syncQuestionSet(set){
  applyFileSet(set);
  clearBanner("qsync_"+set);
  toast("Questionnaire updated to "+qsLabel(set)+" — completed audits keep their own snapshots.");
  if(typeof renderSidebar==="function"){ renderSidebar(); renderMain(); updateHeader(); }
}
window.FO_SYNC_QS=syncQuestionSet;
function syncQsOnBoot(){
  ["full","daily","wh","whdaily"].forEach(function(set){
    var ck=setConfigKey(set), file=fileStamp(set), dev=(state.qsMeta&&state.qsMeta[set])||{base:0,edits:0};
    if(!state[ck]){
      /* device tracks the file already — adopt the file's stamp, tell the user only on a real content change */
      if(file.base>dev.base && dev.base>0)
        setBanner("qsnew_"+set,"info","Questionnaire updated: "+SETNAMES[set]+" is now "+"v"+file.base+" (from this file).","Completed audits are unaffected — they keep the exact questions they were taken with.");
      state.qsMeta[set]={base:file.base, edits:file.edits};
      return;
    }
    if(qsNewer(dev,file)){
      setBanner("qsold","err","⚠ This copy of the app is OLDER than the questionnaire this device was using ("+SETNAMES[set]+": file has v"+file.base+", this device is on "+qsLabel(set)+").","You may have opened an outdated file. Close it and open the latest “Flame on Audit.html”. Nothing was changed or downgraded.");
      return;
    }
    if(qsNewer(file,dev)){
      var dirty=dirtyDraftsFor(set);
      if(dev.edits===0 && dirty.length===0){
        applyFileSet(set);
        setBanner("qsnew_"+set,"info","Questionnaire updated: "+SETNAMES[set]+" refreshed to v"+file.base+" from this file.","The previous copy was archived in browser storage. Completed audits keep their own snapshots.");
      } else {
        setBanner("qsync_"+set,"warn","A newer "+SETNAMES[set]+" questionnaire (v"+file.base+") is in this file — this device is running "+qsLabel(set)+".",
          (dev.edits>0?"This device's question set has admin edits. ":"")
          +(dirty.length?("In-progress drafts: "+dirty.join(", ")+" — their answers stay attached to every question that still exists. "):"")
          +"To update: Admin → “Sync to latest questionnaire” (your current set is archived first, and completed audits are never touched).");
      }
    }
  });
  save();
}
function updateVersionChip(){
  var key=activeSetKey(), lbl=qsLabel(key);

  ["full","daily","wh","whdaily"].forEach(function(s){ if(BANNERS["qsync_"+s]) pending=true; });

    chip.className="prog qs"+(stale?" stale":(pending?" warn":""));

  }

}

/* ---- Derived state helpers ---- */
function isDaily(){ return state.auditType==="daily"; }
function typeMeta(){ return TYPES[state.auditType]||TYPES.weekly; }
/* Branch -> questionnaire profile. Every SECS()/weight read routes through these,
   so selecting the Warehouse loads the warehouse question sets and weights. */
function branchProfile(b){ return (state.branchProfiles&&state.branchProfiles[b])||PROFILE_DEFAULT[b]||"restaurant"; }
function curProfile(){ return branchProfile(state.currentBranch); }
function FULLSECS(){ return curProfile()==="warehouse"?WSECTIONS:SECTIONS; }
function DAILYSECS(){ return curProfile()==="warehouse"?WDSECTIONS:DSECTIONS; }
function SECS(){ return isDaily()?DAILYSECS():FULLSECS(); }
function CATW(){ return curProfile()==="warehouse"?WCATWEIGHTS:CATWEIGHTS; }
function CATN(){ return curProfile()==="warehouse"?WCATNAMES:CATNAMES; }
function cur(){ if(!state.currentBranch) return null; var d=state.data[state.auditType]; if(!d[state.currentBranch]) d[state.currentBranch]=emptyAudit(); return d[state.currentBranch]; }
function CS(){ var c=cur(); return c?c.scores:{}; }
function CC(){ var c=cur(); return c?c.critical:{}; }
function k(sec,ch){ return sec.id+"||"+ch.id; }
function getSec(id){ var L=SECS(); for(var i=0;i<L.length;i++) if(L[i].id===id) return L[i]; return null; }
function secIndex(id){ return SECS().findIndex(function(s){return s.id===id;}); }
function secLabelFor(i,isD,profile){ return isD?("R"+(i+1)):(profile==="warehouse"?("W"+(i+1)):("§"+(i+7))); }
function secNum(sec){ return secLabelFor(secIndex(sec.id), isDaily(), curProfile()); }

function fullR(){ return pureFullResult(FULLSECS(), CATW(), CS(), CC(), CRITICAL); }
function dailyR(){ return pureDailyResult(DAILYSECS(), CS()); }
function catScore(cat){ return fullR().cats[cat]; }
function corporate(){ return fullR().raw; }
function isAutoFail(){ return fullR().fail; }
function dailyCompliance(){ return dailyR().raw; }
function dailyStops(){ return dailyR().stops; }
function sectionPct(sec){ var sc=CS(),yes=0,no=0; sec.checks.forEach(function(ch){ var v=sc[k(sec,ch)]; if(v==="yes")yes++; else if(v==="no")no++; }); if(yes+no===0) return null; return yes/(yes+no)*100; }
function gradeParts(){

  }

  if(r.score===null) return {badge:"—", band:"n", score:"—", tier:"Not started", fail:false, reasons:[]};

function tierMeta(tier,fail){ if(fail||/Recovery/.test(tier||""))return{label:"Recovery",cls:"t-rec"}; if(/Platinum/.test(tier))return{label:"Platinum",cls:"t-plat"}; if(/Gold/.test(tier))return{label:"Gold",cls:"t-gold"}; if(/Silver/.test(tier))return{label:"Silver",cls:"t-silv"}; if(/Bronze/.test(tier))return{label:"Bronze",cls:"t-bronze"}; return{label:"—",cls:"t-silv"}; }
function dailyBand(status){ return status==="STOP"?"fail":(status==="PASS"?"g":(status==="WATCH"?"a":(status==="FAIL"?"r":""))); }

function secStatus(sec){ var sc=CS(),ans=0,no=0,yes=0; sec.checks.forEach(function(ch){ var v=sc[k(sec,ch)]; if(v){ans++; if(v==="no")no++; else if(v==="yes")yes++;} }); if(ans===0)return{cls:"empty",ans:0,no:0,yes:0}; if(no>0)return{cls:"flag",ans:ans,no:no,yes:yes}; if(ans===sec.checks.length)return{cls:"done",ans:ans,no:0,yes:yes}; return{cls:"partial",ans:ans,no:0,yes:yes}; }
function allFindings(){ var sc=CS(),out=[]; SECS().forEach(function(sec){ sec.checks.forEach(function(ch){ if(sc[k(sec,ch)]==="no") out.push({sec:sec,ch:ch}); }); }); return out; }

/* ---- CAPA helpers ----
   Every "No" auto-creates a CAPA entry (in binary scoring a "No" IS the
   below-threshold item); crit lines get severity Critical. Default due
   date = audit date + settings.capaDueDays (admin-configurable). */
function addDays(iso,days){ try{ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+days); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }catch(e){ return iso; } }
function ensureCapa(key,ch){
  var a=cur(); if(!a) return;
  if(!a.capa[key]) a.capa[key]={cause:"",action:"",owner:"",deadline:addDays(a.date||todayISO(), state.settings.capaDueDays),status:"Open",severity:(ch&&ch.crit)?"Critical":"Standard",statusAt:nowStamp()};
  else { if(CAPA_STATUSES.indexOf(a.capa[key].status)<0) a.capa[key].status="Open"; if(ch&&ch.crit) a.capa[key].severity="Critical"; }
}
function dropAutoCapa(key){
  var a=cur(); if(!a||!a.capa[key]) return;
  var cp=a.capa[key];
  if(!cp.cause&&!cp.action&&!cp.owner) delete a.capa[key]; /* untouched auto entry — remove with the mis-tap */
}
function capaOverdue(cp,today){ return cp && cp.status!=="Verified Closed" && cp.deadline && cp.deadline<today; }
function recordCapaList(rec){
  var out=[], today=todayISO();
  if(!rec.capa) return out;
  Object.keys(rec.capa).forEach(function(key){
    var it=rec.items?rec.items[key]:null;
    if(it&&it.a!=="no") return;
    var q=key, secName="";
    if(rec.snapshot&&rec.snapshot.sections){
      rec.snapshot.sections.forEach(function(s){ s.checks.forEach(function(ch){ if(s.id+"||"+ch.id===key){ q=ch.q; secName=s.name; } }); });
    }
    var cp=rec.capa[key];
    out.push({rec:rec,key:key,q:q,secName:secName,cp:cp,overdue:capaOverdue(cp,today)});
  });
  return out;
}
function activeRecords(t){ return state.history.filter(function(h){ return (h.type||"weekly")===t && !h.supersededBy; }); }
function recById(id){ for(var i=0;i<state.history.length;i++) if(state.history[i].id===id) return state.history[i]; return null; }
function allOpenCapas(branch){
  var out=[];
  state.history.forEach(function(rec){
    if(rec.supersededBy) return;
    if(branch&&rec.branch!==branch) return;
    recordCapaList(rec).forEach(function(x){ out.push(x); });
  });
  return out;
}
function overdueCount(branch){ return allOpenCapas(branch).filter(function(x){return x.overdue;}).length; }

/* ---- Storage meter ---- */
function updateStorageMeter(){
  var el=document.getElementById("storeMeter"); if(!el) return;
  var bytes=0; try{ var r=localStorage.getItem(STORE_KEY); bytes=r?r.length*2:0; }catch(e){}

function renderSection(sec){
  document.getElementById("crumb").innerHTML=esc(typeMeta().short)+' · Section: <b>'+esc(sec.name)+'</b>';

  var sub=isDaily()?'Quick pass/fail. Yes = in order · No = a problem — stop items in red halt the day until fixed.':'Score each line against the standard. Yes = meets it · No = a red flag is showing. A "No" on a red-tagged critical line fails the whole audit.';
  var critLabel=isDaily()?'stop item':'food-safety critical';

      +'<div class="rate" role="group" aria-label="Score" data-key="'+key+'">'+rb(key,"yes",v)+rb(key,"no",v)+rb(key,"na",v)+'</div></div>'
      +'<div class="qnote"><input type="text" data-note="'+key+'" value="'+esc((c.notes||{})[key]||"")+'" placeholder="Notes / observation (optional)" aria-label="Note for '+esc(ch.q)+'"></div>'
      +'<div class="qphotos" data-pkey="'+key+'">'+pids.map(function(pid){ return photoThumbHTML(key,pid); }).join("")
      +'<button class="ph-add" data-addphoto="'+key+'">📷 Photo</button></div></div>';
  }).join("");
  var idx=secIndex(sec.id), L=SECS();
  var foot='<div class="secfoot">'
    +(idx>0?'<button class="btn ghost" data-secnav="'+L[idx-1].id+'">← '+esc(L[idx-1].name)+'</button>':'')
    +(idx<L.length-1?'<button class="btn submit" data-secnav="'+L[idx+1].id+'">'+esc(L[idx+1].name)+' →</button>':'<button class="btn submit" data-secnav="'+OVERVIEW+'">Finish → Overview</button>')
    +'</div>';
  document.getElementById("main").innerHTML=
    '<div class="sec-title"><span class="sn">'+esc(secNum(sec))+'</span><h2>'+esc(sec.name)+'</h2><span class="grp">'+esc(sec.grp)+'</span><span class="secscore" id="secScore">'+scoreTxt+'</span></div>'
    +'<div class="sec-sub">'+sub+'</div>'+infer+rows+foot;

  document.querySelectorAll('#main [data-secnav]').forEach(function(b){ b.addEventListener("click", function(){ state.active=b.dataset.secnav; save(); renderMain(); renderSidebar(); window.scrollTo(0,0); }); });

function rb(key,v,curv){ var lab=v==="yes"?"Yes":(v==="no"?"No":"N/A"); return '<button data-key="'+key+'" data-v="'+v+'" aria-pressed="'+(curv===v?'true':'false')+'"'+(curv===v?' class="sel"':'')+'>'+lab+'</button>'; }
function setScore(key,v){
  var a=cur(); if(!a) return;
  var secId=key.slice(0,key.indexOf("||")); var sec=getSec(secId); var ch=null;
  if(sec){ for(var i=0;i<sec.checks.length;i++) if(k(sec,sec.checks[i])===key) ch=sec.checks[i]; }

  save();
  document.querySelectorAll('#main .rate button[data-key="'+key+'"]').forEach(function(b){ var on=a.scores[b.dataset.key]===b.dataset.v; b.classList.toggle("sel",on); b.setAttribute("aria-pressed",on?"true":"false"); });

        +'<td>'+esc(x.cp.action||"—")+'<div class="cs">'+esc(x.cp.owner||"no owner")+'</div></td>'

/* ---- Dashboard ---- */
function histFor(t){
  return state.history.filter(function(h){
    if((h.type||"weekly")!==t) return false;
    if(h.supersededBy) return false;
    if(DASH_FROM&&(h.date||"")<DASH_FROM) return false;
    if(DASH_TO&&(h.date||"")>DASH_TO) return false;
    return true;
  });
}
function dailyCols(hlist){ var cols=DSECTIONS.map(function(s){return {id:s.id,name:s.name};}); var seen={}; cols.forEach(function(c){seen[c.id]=true;}); (hlist||[]).forEach(function(r){ if(r.cats) Object.keys(r.cats).forEach(function(id){ if(!seen[id]){ seen[id]=true; cols.push({id:id,name:(r.catNames&&r.catNames[id])||id}); } }); }); return cols; }
function latestPerBranch(list){
  var map={}; list.forEach(function(h){ var cu=map[h.branch]; if(!cu||h.date>cu.date||(h.date===cu.date&&(h.ts||0)>(cu.ts||0))) map[h.branch]=h; });
  /* auto-failed audits rank BELOW every non-failed audit regardless of raw score */
  return Object.keys(map).map(function(b){return map[b];}).sort(function(a,b){
    var fa=a.fail?1:0, fb=b.fail?1:0;
    if(fa!==fb) return fa-fb;
    return (b.score==null?-1:b.score)-(a.score==null?-1:a.score);
  });
}

function renderFullDash(dt,h,head){

    +stat("In recovery", String(recovery), "tier B or below", recovery>0?"alert":"")

    +'</div>';

  html+='<div class="panel"><div class="ph">Branch ranking (§26)<span class="sub">latest '+esc(TYPES[dt].short.toLowerCase())+' audit per branch — an auto-fail ranks last regardless of score</span></div><div class="tablewrap"><table class="rank"><thead><tr><th>Rank</th><th>Branch</th><th>Score</th><th>Grade</th><th>Tier</th><th>Food safety</th><th>Findings</th><th>CAPA overdue</th></tr></thead><tbody>';
  latest.forEach(function(r,i){

      +'<td><div class="scorecell"><span class="sval">'+(r.score==null?"—":r.score+"%")+'</span><span class="sbar"><i style="width:'+(r.score==null?0:r.score)+'%;background:'+barcol+'"></i></span></div></td>'
      +'<td><span class="gd '+gb+'">'+esc(r.grade)+'</span></td>'
      +'<td><span class="tchip '+tm.cls+'">'+tm.label+'</span></td>'
      +'<td><span class="sval" style="font-family:var(--mono);font-weight:700">'+(r.safety==null?"—":Math.round(r.safety)+"%")+'</span></td>'
      +'<td>'+((r.findings||0)>0?'<span class="flagpill">'+r.findings+'</span>':'<span class="okpill">0</span>')+(r.fail?' <span class="flagpill hot">CRIT</span>':'')+'</td>'
      +'<td>'+(od>0?'<span class="flagpill hot">'+od+'</span>':'<span class="okpill">0</span>')+'</td></tr>';
  });
  html+='</tbody></table></div></div>';

function buildTrend(hist){
  var SH={Morning:0,Evening:1,Night:2};
  var hasShift=hist.some(function(h){return !!h.shift;});
  function keyOf(h){ return hasShift?(h.date+"|"+(h.shift||"")):h.date; }
  function labelOf(key){ if(!hasShift) return key.slice(5); var p=key.split("|"); return p[0].slice(5)+(p[1]?" "+p[1].charAt(0):""); }
  /* window: keep only each branch's most recent TREND_WINDOW points so a year of history stays readable */
  var byBranch={};
  hist.forEach(function(h){ if(!h.date) return; (byBranch[h.branch]=byBranch[h.branch]||[]).push(h); });
  var kept=[];
  Object.keys(byBranch).forEach(function(b){
    var pts=byBranch[b].slice().sort(function(a,c){ var ka=keyOf(a),kc=keyOf(c); if(ka!==kc) return ka<kc?-1:1; return (a.ts||0)-(c.ts||0); });
    kept=kept.concat(pts.slice(-TREND_WINDOW));
  });
  var keys=[]; kept.forEach(function(h){ var kk=keyOf(h); if(keys.indexOf(kk)<0) keys.push(kk); });
  keys.sort(function(a,c){ var ap=a.split("|"), cp=c.split("|"); if(ap[0]!==cp[0]) return ap[0]<cp[0]?-1:1; return (SH[ap[1]]||0)-(SH[cp[1]]||0); });
  var branches=[]; kept.forEach(function(h){ if(branches.indexOf(h.branch)<0) branches.push(h.branch); });
  var W=720,H=270,padL=40,padR=14,padT=14,padB=40,plotW=W-padL-padR,plotH=H-padT-padB;
  var xFor=function(key){ var i=keys.indexOf(key); return keys.length<=1?padL+plotW/2:padL+plotW*i/(keys.length-1); };
  var yFor=function(s){ return padT+plotH*(1-s/100); };
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="trendsvg" role="img" aria-label="Score trend by branch" preserveAspectRatio="xMidYMid meet">';
  [0,25,50,75,100].forEach(function(v){ var y=yFor(v); svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#EAE4D6" stroke-width="1"/><text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="#8C8577" font-family="monospace">'+v+'</text>'; });
  var labelEvery=Math.max(1,Math.ceil(keys.length/9));
  keys.forEach(function(key,i){ if(i%labelEvery!==0&&i!==keys.length-1) return; var x=xFor(key); svg+='<text x="'+x+'" y="'+(H-padB+15)+'" text-anchor="middle" font-size="8.5" fill="#6E6858" font-family="monospace">'+esc(labelOf(key))+'</text>'; });
  branches.forEach(function(b,bi){
    var col=BRANCH_COLORS[bi%BRANCH_COLORS.length];
    var pts=kept.filter(function(h){return h.branch===b&&h.score!=null;}).slice().sort(function(a,c){return keys.indexOf(keyOf(a))-keys.indexOf(keyOf(c));});
    if(pts.length>1){ var d=""; pts.forEach(function(p,i){ d+=(i===0?"M":" L")+xFor(keyOf(p)).toFixed(1)+" "+yFor(p.score).toFixed(1); }); svg+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round"/>'; }
    pts.forEach(function(p){ svg+='<circle cx="'+xFor(keyOf(p)).toFixed(1)+'" cy="'+yFor(p.score).toFixed(1)+'" r="3.6" fill="'+col+'"'+(p.fail?' stroke="#1A1A1A" stroke-width="2"':'')+'/>'; });
  });
  svg+='</svg>';
  return svg+'<div class="trend-legend">'+branches.map(function(b,bi){ return '<span class="tl"><i style="background:'+BRANCH_COLORS[bi%BRANCH_COLORS.length]+'"></i>'+esc(b)+'</span>'; }).join("")+'</div>';
}

function completeAudit(){

  if(!c.by.trim()){ alert("Enter the auditor's name first — every locked audit records who took it."); return; }
  var t=totals();

  var un=t.tot-t.ans;
  if(un>0 && !confirm(un+" line"+(un===1?" is":"s are")+" still unanswered. Complete anyway? Unanswered lines are simply excluded from the score (they do NOT count against the branch).")) return;
  if(!c.designation.trim() && !confirm("No designation entered for the auditor. Complete without it?")) return;

    return !h.supersededBy && (h.type||"weekly")===rec.type && h.branch===rec.branch && h.date===rec.date

  });

/* ---- Photos (IndexedDB; localStorage stays lean) ---- */
var IDB_DB=null, IDB_FAILED=false, THUMB_URLS=[];
function idb(){
  return new Promise(function(res,rej){
    if(IDB_DB) return res(IDB_DB);
    if(IDB_FAILED||!window.indexedDB){ IDB_FAILED=true; return rej(new Error("IndexedDB unavailable")); }
    var rq;
    try{ rq=indexedDB.open("flameon_audit_photos",1); }catch(e){ IDB_FAILED=true; return rej(e); }
    rq.onupgradeneeded=function(){ rq.result.createObjectStore("photos",{keyPath:"id"}); };
    rq.onsuccess=function(){ IDB_DB=rq.result; res(IDB_DB); };
    rq.onerror=function(){ IDB_FAILED=true; rej(rq.error||new Error("IndexedDB open failed")); };
  });
}
function idbPut(recd){ return idb().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction("photos","readwrite"); tx.objectStore("photos").put(recd); tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; tx.onabort=function(){rej(tx.error||new Error("photo write aborted (storage full?)"));}; }); }); }
function idbGet(id){ return idb().then(function(db){ return new Promise(function(res,rej){ var rq=db.transaction("photos").objectStore("photos").get(id); rq.onsuccess=function(){res(rq.result||null);}; rq.onerror=function(){rej(rq.error);}; }); }); }
function idbDel(id){ return idb().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction("photos","readwrite"); tx.objectStore("photos").delete(id); tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }); }
function idbAll(){ return idb().then(function(db){ return new Promise(function(res,rej){ var rq=db.transaction("photos").objectStore("photos").getAll(); rq.onsuccess=function(){res(rq.result||[]);}; rq.onerror=function(){rej(rq.error);}; }); }); }
function photoReferenced(pid){

  state.history.forEach(function(rec){ if(!rec.photos) return; Object.keys(rec.photos).forEach(function(key){ if((rec.photos[key]||[]).indexOf(pid)>=0) found=true; }); });

}
function compressImage(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      URL.revokeObjectURL(url);
      try{
        var w=img.naturalWidth, h=img.naturalHeight;
        if(!w||!h) return rej(new Error("unreadable image"));
        var scale=Math.min(1,PHOTO_MAX_DIM/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*scale)), chh=Math.max(1,Math.round(h*scale));
        var cv=document.createElement("canvas"); cv.width=cw; cv.height=chh;
        cv.getContext("2d").drawImage(img,0,0,cw,chh);
        var qs=[0.72,0.6,0.5,0.4,0.3];
        (function tryQ(i){
          cv.toBlob(function(b){
            if(!b) return rej(new Error("could not encode JPEG"));
            if(b.size<=PHOTO_MAX_BYTES||i>=qs.length-1) res(b); else tryQ(i+1);
          },"image/jpeg",qs[i]);
        })(0);
      }catch(e){ rej(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("unsupported image format")); };
    img.src=url;
  });
}
function photoCount(a){ var n=0; Object.keys(a.photos||{}).forEach(function(key){ n+=(a.photos[key]||[]).length; }); return n; }
function addPhoto(key,file){

  PENDING_ASYNC++;
  var done=function(){ PENDING_ASYNC=Math.max(0,PENDING_ASYNC-1); };
  compressImage(file).then(function(blob){
    var id="p"+genId();
    return idbPut({id:id,blob:blob,bytes:blob.size,ts:Date.now()}).then(function(){
      if(!c.photos[key]) c.photos[key]=[];
